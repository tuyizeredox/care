# ============================================================================
#  CARE Workflow — Render Blueprint
#
#  Deploys the backend only: a managed Postgres and the NestJS API. The Next.js
#  client is deployed separately on Vercel, which builds it on bigger machines
#  and serves it from a CDN. Point Render at this file (New → Blueprint) and it
#  provisions the database and the API, wiring DATABASE_URL automatically.
#
#  Two values must be set by hand once Vercel has assigned a domain — see the
#  comments on CORS_ORIGINS and NEXT_PUBLIC_APP_URL below.
# ============================================================================

databases:
  - name: care-db
    databaseName: care
    user: care
    # Keep the database in the same region as the services; every extra
    # millisecond of round trip is multiplied by the queries in a request.
    region: frankfurt
    plan: basic-256mb

services:
  # --------------------------------------------------------------------------
  # API
  # --------------------------------------------------------------------------
  - type: web
    name: care-api
    runtime: node
    region: frankfurt
    plan: starter
    branch: main
    # Only redeploy the API when something it depends on actually changed.
    buildFilter:
      paths:
        - apps/api/**
        - package.json
        - package-lock.json
        - render.yaml
    buildCommand: npm ci --include=dev && npm run prisma:generate && npm run build:api
    # Runs after the build, before traffic switches to the new version. If your
    # plan does not include pre-deploy commands, append `&& npm run prisma:deploy`
    # to buildCommand instead.
    preDeployCommand: npm run prisma:deploy
    startCommand: npm run start:api
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: '22'

      # NODE_ENV=production above makes npm default to --omit=dev, which strips
      # the build toolchain (@nestjs/cli, typescript, tailwind). Root .npmrc sets
      # this too; keeping it here means the build survives a hand-edited command.
      - key: NPM_CONFIG_INCLUDE
        value: dev

      # Render's managed Postgres is not a transaction-mode pooler, so the same
      # connection string serves the app and Prisma Migrate.
      - key: DATABASE_URL
        fromDatabase:
          name: care-db
          property: connectionString
      - key: DIRECT_URL
        fromDatabase:
          name: care-db
          property: connectionString

      # Generated once by Render and then held; never commit real secrets.
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true

      - key: JWT_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: BCRYPT_SALT_ROUNDS
        value: '12'

      # The web client is deployed on Vercel, so Render cannot resolve its URL
      # for us -- fromService only reaches services inside this blueprint. Set
      # both by hand in the dashboard once Vercel has assigned a domain:
      #   CORS_ORIGINS        = https://<your-app>.vercel.app
      #   NEXT_PUBLIC_APP_URL = https://<your-app>.vercel.app
      #
      # CORS_ORIGINS is an exact-match, comma-separated list (see
      # apps/api/src/config/configuration.ts). Vercel preview deploys get a fresh
      # hostname each time, so add them individually or test against production.
      - key: CORS_ORIGINS
        sync: false
      - key: NEXT_PUBLIC_APP_URL
        sync: false

      - key: RATE_LIMIT_TTL
        value: '60'
      - key: RATE_LIMIT_MAX
        value: '300'
      - key: AUTH_RATE_LIMIT_MAX
        value: '10'

      # Render's filesystem is wiped on every deploy. Either attach the disk
      # declared below, or switch to s3/cloudinary and fill in the credentials.
      - key: STORAGE_PROVIDER
        value: local
      - key: STORAGE_LOCAL_PATH
        value: /var/data/uploads
      - key: MAX_UPLOAD_SIZE_MB
        value: '25'

      # Email is off until SMTP is configured; messages are written to the log.
      - key: EMAIL_ENABLED
        value: 'false'
      - key: EMAIL_FROM
        value: CARE Workflow <no-reply@care.demo>

      - key: REMINDERS_ENABLED
        value: 'true'
      - key: REMINDERS_CRON
        value: 0 7 * * *

    # Uploads must outlive a deploy. Remove this block if you use S3 or
    # Cloudinary instead.
    disk:
      name: care-uploads
      mountPath: /var/data
      sizeGB: 5

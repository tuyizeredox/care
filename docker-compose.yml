services:
  db:
    image: postgres:16-alpine
    container_name: care-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: care
      POSTGRES_PASSWORD: care
      POSTGRES_DB: care
    ports:
      - "5432:5432"
    volumes:
      - care-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U care -d care"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  care-db-data:
